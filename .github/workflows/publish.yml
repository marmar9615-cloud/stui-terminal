name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Publish to TestPyPI after the testpypi environment is configured"
        required: true
        type: boolean
        default: false
      publish_to_pypi:
        description: "Publish to real PyPI after the pypi environment is configured"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-dispatch:
    name: Validate publish inputs
    runs-on: ubuntu-latest

    steps:
      - name: Ensure dispatch publishes to at most one index
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            inputs.publish_to_testpypi &&
            inputs.publish_to_pypi
          }}
        run: |
          echo "Choose either publish_to_testpypi or publish_to_pypi, not both."
          exit 1

  build:
    name: Build and check distributions
    needs: validate-dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_to_testpypi &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_to_pypi &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
